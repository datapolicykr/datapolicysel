<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
<defs><style>
.t{font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#1f2530}.m{fill:#7b8490}.o{fill:#f05a00}.ob{fill:#fff0e8}.gb{fill:#eef2f6}.card{fill:#fff;stroke:#f0d8c8;stroke-width:2}.note{fill:#fff8f2;stroke:#f0c9ad;stroke-width:2}.h{font-weight:800;font-size:28px}.s{font-size:18px}.b{font-weight:800;font-size:22px}.xs{font-size:16px}.num{fill:#fff;font-weight:900;font-size:46px;text-anchor:middle;dominant-baseline:middle}.arrow{fill:#fff;font-weight:900;font-size:28px;text-anchor:middle;dominant-baseline:middle}
</style></defs>
<!-- TOP 1 -->
<g transform="translate(0,0)"><rect class="card" x="8" y="8" rx="20" width="384" height="284"/><circle cx="58" cy="58" r="34" fill="#fff0e8"/><rect x="38" y="42" width="40" height="26" rx="3" fill="none" stroke="#f05a00" stroke-width="6"/><line x1="58" y1="68" x2="58" y2="80" stroke="#f05a00" stroke-width="6"/><line x1="44" y1="80" x2="72" y2="80" stroke="#f05a00" stroke-width="6"/><text class="t h" x="105" y="52">사용성</text><text class="t s m" x="105" y="82">동일한 사용 환경,</text><text class="t s m" x="105" y="106">더 편리한 서비스</text><rect class="gb" x="28" y="130" rx="10" width="145" height="118"/><text class="t b" x="54" y="164">기존 업무</text><text class="t xs" x="48" y="194">단말기(유선)</text><text class="t xs" x="62" y="217">멀티패드</text><text class="t xs" x="66" y="240">일상 업무</text><circle class="o" cx="200" cy="188" r="20"/><text class="arrow" x="200" y="188">→</text><rect class="ob" x="227" y="130" rx="10" width="145" height="118"/><text class="o b" x="244" y="165">기존과 동일함</text><text class="t xs" x="247" y="201">동일하게 제공</text><text class="t xs" x="258" y="226">(PMS 무관)</text></g>
<!-- TOP 2 -->
<g transform="translate(400,0)"><rect class="card" x="8" y="8" rx="20" width="384" height="284"/><circle cx="58" cy="58" r="34" fill="#fff0e8"/><ellipse cx="58" cy="45" rx="21" ry="8" fill="#f05a00"/><rect x="37" y="45" width="42" height="25" fill="#f05a00"/><ellipse cx="58" cy="70" rx="21" ry="8" fill="#f05a00"/><text class="t h" x="105" y="52">운영비용</text><text class="t s m" x="105" y="82">같은 서비스,</text><text class="t s m" x="105" y="106">더 합리적인 비용</text><rect class="gb" x="28" y="130" rx="10" width="145" height="98"/><text class="t h" x="49" y="170">135만원</text><text class="t h" x="73" y="203">/3년</text><text class="t xs m" x="57" y="222">(현재 사용)</text><circle class="o" cx="200" cy="178" r="20"/><text class="arrow" x="200" y="178">→</text><rect class="ob" x="227" y="130" rx="10" width="145" height="98"/><text class="o h" x="251" y="170">36만원</text><text class="o h" x="275" y="203">/3년</text><text class="t xs m" x="266" y="222">(오스템)</text><text class="o b" x="108" y="268">약 99만원 절감</text></g>
<!-- TOP 3 -->
<g transform="translate(800,0)"><rect class="card" x="8" y="8" rx="20" width="384" height="284"/><circle cx="58" cy="58" r="34" fill="#fff0e8"/><path d="M58 34 L78 42 V58 C78 74 68 84 58 90 C48 84 38 74 38 58 V42 Z" fill="none" stroke="#f05a00" stroke-width="6"/><path d="M49 59 l7 7 13-16" fill="none" stroke="#f05a00" stroke-width="5"/><text class="t h" x="105" y="52">사용조건</text><text class="t s m" x="105" y="82">불필요한 부담은 줄이고,</text><text class="t s m" x="105" y="106">안정적인 운영</text><rect class="gb" x="28" y="130" rx="10" width="145" height="118"/><text class="t b" x="45" y="174">기기값 2~3배</text><text class="t xs" x="56" y="204">(위약금 부담)</text><circle class="o" cx="200" cy="188" r="20"/><text class="arrow" x="200" y="188">→</text><rect class="ob" x="227" y="130" rx="10" width="145" height="118"/><text class="o b" x="246" y="164">관리 · 안전</text><text class="o b" x="245" y="190">명확한 조건</text><text class="t xs" x="263" y="220">3년 (동일)</text><text class="t xs" x="266" y="244">할부 잔금</text></g>
<!-- TOP 4 -->
<g transform="translate(1200,0)"><rect class="card" x="8" y="8" rx="20" width="384" height="284"/><circle cx="58" cy="58" r="34" fill="#fff0e8"/><circle cx="48" cy="52" r="10" fill="#f05a00"/><circle cx="68" cy="52" r="10" fill="#f05a00"/><path d="M30 78c3-16 15-22 28-22s25 6 28 22z" fill="#f05a00"/><text class="t h" x="105" y="52">지원</text><text class="t s m" x="105" y="82">언제든, 더 가까이</text><text class="t s m" x="105" y="106">도와드리는 지원 체계</text><rect class="gb" x="28" y="130" rx="10" width="145" height="118"/><text class="t b" x="58" y="180">현금 등</text><text class="t b" x="53" y="209">불법지원</text><circle class="o" cx="200" cy="188" r="20"/><text class="arrow" x="200" y="188">→</text><rect class="ob" x="227" y="130" rx="10" width="145" height="118"/><text class="o b" x="242" y="166">운영비용만으로</text><text class="o b" x="273" y="193">지원</text><text class="o xs" x="238" y="221">+ 오스템 풀랫폼</text><text class="o xs" x="252" y="244">서비스 경험</text></g>
<!-- BOTTOM 1 -->
<g transform="translate(0,300)"><rect class="card" x="8" y="8" rx="20" width="384" height="284"/><circle class="o" cx="56" cy="58" r="35"/><text class="num" x="56" y="58">1</text><text class="t h" x="105" y="48">변경 부담 최소</text><text class="t s m" x="105" y="78">기존 결제 경험은 그대로,</text><text class="t s m" x="105" y="102">추가 학습 없이 쉽게 전환</text><rect class="note" x="24" y="126" rx="16" width="352" height="140"/><text class="o b" x="48" y="160">💬 권장 멘트</text><text class="t xs" x="48" y="192">새로운 결제방식을 배우는 것이 아니라,</text><text class="t xs" x="48" y="217">단말기 교체로 기존 흐름을 유지하면서</text><text class="t xs" x="48" y="242">오스템 편의를 더하는 제안입니다.</text></g>
<!-- BOTTOM 2 -->
<g transform="translate(400,300)"><rect class="card" x="8" y="8" rx="20" width="384" height="284"/><circle class="o" cx="56" cy="58" r="35"/><text class="num" x="56" y="58">2</text><text class="t h" x="105" y="48">PMS 연동 편의</text><text class="t s m" x="105" y="78">수납 · 정산 수작업을 줄여</text><text class="t s m" x="105" y="102">업무 효율을 높입니다.</text><rect class="note" x="24" y="126" rx="16" width="352" height="140"/><text class="o b" x="48" y="160">💬 권장 멘트</text><text class="t xs" x="48" y="192">직원이 금액을 다시 입력하고 나중에</text><text class="t xs" x="48" y="217">정산을 맞추는 번거로움을 줄이는 것이</text><text class="t xs" x="48" y="242">핵심입니다.</text></g>
<!-- BOTTOM 3 -->
<g transform="translate(800,300)"><rect class="card" x="8" y="8" rx="20" width="384" height="284"/><circle class="o" cx="56" cy="58" r="35"/><text class="num" x="56" y="58">3</text><text class="t h" x="105" y="48">현장 밀착 지원</text><text class="t s m" x="105" y="78">오스템 전국 영업망과</text><text class="t s m" x="105" y="102">전담 인력이 직접 함께합니다.</text><rect class="note" x="24" y="126" rx="16" width="352" height="140"/><text class="o b" x="48" y="160">💬 권장 멘트</text><text class="t xs" x="48" y="192">결제만 파는 서비스가 아니라,</text><text class="t xs" x="48" y="217">오스템 담당자가 방문해 함께 챙기는</text><text class="t xs" x="48" y="242">운영관리 서비스입니다.</text></g>
<g transform="translate(1200,300)"><rect width="400" height="300" fill="#fff"/></g>
</svg>